<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informatik – Lernwerkzeuge</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#26344b;background:#f5f9fd}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f4f9ff,#eaf3fd)}
main{max-width:900px;margin:0 auto;padding:clamp(28px,6vw,65px) 20px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:0 0 8px}
p{color:#60718a;margin:0;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:34px}
a{color:inherit;text-decoration:none;display:block;background:white;border:1px solid #dbe7f4;border-radius:24px;padding:28px;box-shadow:0 12px 32px #325b8914;transition:transform .15s,box-shadow .15s}
a:hover,a:focus-visible{transform:translateY(-4px);box-shadow:0 16px 36px #325b8924;outline:3px solid #9dd0ff;outline-offset:2px}
.icon{font-size:3rem;display:block;margin-bottom:22px}
strong{display:block;font-size:1.2rem;margin-bottom:8px}
footer{margin-top:24px;color:#667790;font-size:.86rem}
@media(max-width:640px){.grid{grid-template-columns:1fr}a{padding:23px}}
</style>
</head>
<body>
<main>
<h1>Informatik</h1>
<p>Unsere digitalen Lernwerkzeuge</p>
<div class="grid">
<a href="./computer/">
<span class="icon" aria-hidden="true">🖥️</span>
<strong>Informatiksysteme entdecken</strong>
<p>Geräte und Bauteile erkunden</p>
</a>
<a href="./ordner/">
<span class="icon" aria-hidden="true">📁</span>
<strong>Miriams Informatikordner</strong>
<p>Arbeitsblätter sortieren</p>
</a>
</div>
</main>
</body>
</html>
