<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miriams Informatikordner</title>
  <style>
    :root {
      --bg: #f5fbff;
      --panel: #ffffff;
      --line: #d7e6f2;
      --text: #234;
      --muted: #6b7a88;
      --blue: #5fb5ff;
      --blue-soft: #e7f4ff;
      --yellow: #ffd45f;
      --yellow-soft: #fff7da;
      --green: #7bd7a5;
      --shadow: 0 10px 28px rgba(44, 87, 124, 0.14);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #f8fcff 0%, #eef7ff 100%);
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .topbar {
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(215, 230, 242, 0.9);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 18px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(145deg, #ffef9d, #ffd45f);
      display: grid;
      place-items: center;
      font-size: 28px;
      box-shadow: inset 0 -6px 0 rgba(0,0,0,0.05);
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      line-height: 1.1;
    }

    .mini-note {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 14px;
      padding: 11px 15px;
      background: var(--panel);
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 4px 14px rgba(44, 87, 124, 0.10);
      border: 1px solid var(--line);
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
    }

    button:hover,
    button:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(44, 87, 124, 0.14);
      outline: none;
      background: #fbfdff;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      padding: 16px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.06rem;
      font-weight: 700;
    }

    .pill {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      background: var(--blue-soft);
      color: #245a8d;
      font-weight: 700;
      white-space: nowrap;
    }

    .tray {
      min-height: 500px;
      padding: 0 16px 18px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .sheet-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      border: 1px solid #dce9f5;
      border-radius: 18px;
      box-shadow: 0 8px 16px rgba(49, 92, 133, 0.08);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: grab;
      transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
      user-select: none;
      touch-action: none;
    }

    .sheet-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(49, 92, 133, 0.12);
      border-color: #c7ddf1;
    }

    .sheet-card.dragging {
      opacity: 0.86;
      transform: rotate(1.5deg) scale(1.02);
      cursor: grabbing;
    }

    .sheet-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(180deg, #fefefe, #f2f7fb);
      border: 1px solid #d9e5ef;
      position: relative;
      flex: 0 0 auto;
      box-shadow: inset 0 -3px 0 rgba(78, 120, 156, 0.06);
    }

    .sheet-icon::before {
      content: "";
      position: absolute;
      inset: 10px 10px auto 10px;
      height: 2px;
      background: #b8cddd;
      box-shadow: 0 8px 0 #b8cddd, 0 16px 0 #b8cddd;
      border-radius: 2px;
    }

    .sheet-icon::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 14px;
      height: 14px;
      background: #eaf3fb;
      clip-path: polygon(0 0, 100% 0, 100% 100%);
      border-top-right-radius: 14px;
    }

    .sheet-text {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sheet-name {
      font-weight: 700;
      font-size: 0.98rem;
      line-height: 1.2;
    }

    .sheet-sub {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.1;
    }

    .folders-wrap {
      padding: 0 16px 18px;
      display: grid;
      gap: 16px;
    }

    .big-folder {
      border: 1px solid #dbe7f0;
      background: linear-gradient(180deg, #fffdf6 0%, #fffaf0 100%);
      border-radius: 24px;
      padding: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    .big-folder-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 4px 10px;
      margin-bottom: 2px;
    }

    .folder-icon {
      width: 56px;
      height: 44px;
      position: relative;
      flex: 0 0 auto;
      filter: drop-shadow(0 5px 8px rgba(216, 171, 50, 0.18));
    }

    .folder-icon::before,
    .folder-icon::after {
      content: "";
      position: absolute;
      left: 0;
      border-radius: 10px;
      background: linear-gradient(180deg, #ffe58b 0%, #ffd45f 100%);
      border: 1px solid #f0c84e;
    }

    .folder-icon::before {
      top: 0;
      width: 26px;
      height: 12px;
      border-bottom: none;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      left: 6px;
    }

    .folder-icon::after {
      top: 8px;
      width: 56px;
      height: 36px;
      box-shadow: inset 0 -5px 0 rgba(0,0,0,0.04);
    }

    .folder-title {
      font-size: 1.12rem;
      font-weight: 800;
    }

    .folder-sub {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 2px;
    }

    .subfolder-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 6px;
    }

    .dropzone {
      min-height: 250px;
      background: linear-gradient(180deg, #fafdff, #f5fbff);
      border: 2px dashed #cfe0ec;
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.14s ease;
    }

    .dropzone.over {
      background: #eef8ff;
      border-color: #8bc5ff;
      transform: translateY(-1px);
    }

    .dropzone.correct-glow {
      box-shadow: 0 0 0 4px rgba(123, 215, 165, 0.24) inset;
    }

    .subfolder-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 4px 4px;
    }

    .subfolder-head .folder-icon {
      width: 42px;
      height: 34px;
    }

    .subfolder-head .folder-icon::before {
      width: 18px;
      height: 9px;
      left: 5px;
    }

    .subfolder-head .folder-icon::after {
      width: 42px;
      height: 28px;
      top: 6px;
    }

    .subfolder-name {
      font-weight: 800;
      font-size: 1rem;
      line-height: 1.1;
    }

    .subfolder-mini {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.1;
    }

    .droparea {
      flex: 1;
      display: grid;
      gap: 9px;
      align-content: start;
      min-height: 155px;
      padding-top: 2px;
    }

    .droparea .sheet-card {
      padding: 10px 12px;
    }

    .droparea .sheet-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
    }

    .droparea .sheet-name {
      font-size: 0.93rem;
    }

    .droparea .sheet-sub {
      display: none;
    }

    .drop-hint {
      color: #8ca0b2;
      font-size: 0.87rem;
      border: 1px dashed #d7e4ee;
      border-radius: 14px;
      text-align: center;
      padding: 14px 10px;
      background: rgba(255,255,255,0.65);
    }

    .sheet-card.correct {
      border-color: #8cdeb1;
      background: linear-gradient(180deg, #ffffff 0%, #f1fff7 100%);
    }

    .check {
      margin-left: auto;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #7bd7a5;
      color: white;
      display: grid;
      place-items: center;
      font-size: 0.85rem;
      font-weight: 900;
      box-shadow: 0 4px 10px rgba(62, 173, 110, 0.28);
    }

    .status {
      background: rgba(255,255,255,0.82);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .progress {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .progress-bar {
      width: 220px;
      max-width: 50vw;
      height: 12px;
      border-radius: 999px;
      background: #edf4f9;
      overflow: hidden;
      border: 1px solid #dde9f2;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #8bc5ff, #7bd7a5);
      transition: width 0.2s ease;
    }

    .status-text {
      font-weight: 700;
    }

    .done-badge {
      display: none;
      padding: 7px 12px;
      border-radius: 999px;
      background: #eefcf3;
      color: #25724b;
      border: 1px solid #bde7ce;
      font-weight: 800;
    }

    .done-badge.show { display: inline-flex; align-items: center; gap: 8px; }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .tray {
        min-height: auto;
      }
      .subfolder-grid {
        grid-template-columns: 1fr;
      }
      .progress-bar { max-width: 100%; width: 180px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="title-wrap">
        <div class="title-icon" aria-hidden="true">📚</div>
        <div>
          <h1>Miriams Informatikordner</h1>
          <div class="mini-note">Arbeitsblätter sortieren</div>
        </div>
      </div>
      <div class="controls">
        <button id="shuffleBtn" type="button">Neu mischen</button>
        <button id="resetBtn" type="button">Zurücksetzen</button>
      </div>
    </div>

    <div class="layout">
      <section class="panel" aria-label="Arbeitsblätter">
        <div class="panel-head">
          <div class="panel-title">📝 Arbeitsblätter</div>
          <div class="pill" id="leftCount">8</div>
        </div>
        <div class="tray" id="tray"></div>
      </section>

      <section class="panel" aria-label="Ordnerbereich">
        <div class="panel-head">
          <div class="panel-title">📁 Ordner</div>
          <div class="pill">Informatik</div>
        </div>
        <div class="folders-wrap">
          <div class="big-folder">
            <div class="big-folder-head">
              <div class="folder-icon" aria-hidden="true"></div>
              <div>
                <div class="folder-title">Informatik</div>
                <div class="folder-sub">mit zwei Themenordnern</div>
              </div>
            </div>
            <div class="subfolder-grid">
              <div class="dropzone" data-folder="bauteile">
                <div class="subfolder-head">
                  <div class="folder-icon" aria-hidden="true"></div>
                  <div>
                    <div class="subfolder-name">Geräte und Bauteile</div>
                    <div class="subfolder-mini">Ordner</div>
                  </div>
                </div>
                <div class="droparea" id="bauteile-area">
                  <div class="drop-hint">Blätter hier ablegen</div>
                </div>
              </div>

              <div class="dropzone" data-folder="eva">
                <div class="subfolder-head">
                  <div class="folder-icon" aria-hidden="true"></div>
                  <div>
                    <div class="subfolder-name">EVA-Prinzip</div>
                    <div class="subfolder-mini">Ordner</div>
                  </div>
                </div>
                <div class="droparea" id="eva-area">
                  <div class="drop-hint">Blätter hier ablegen</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div class="status" aria-live="polite">
      <div class="progress">
        <div class="status-text" id="statusText">0 von 8 sortiert</div>
        <div class="progress-bar" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
      <div class="done-badge" id="doneBadge">✨ Fertig sortiert</div>
    </div>
  </div>

  <script>
    const originalItems = [
      { id: 'p1', title: 'Der Prozessor', subtitle: 'Arbeitsblatt', folder: 'bauteile' },
      { id: 'p2', title: 'Die Tastatur', subtitle: 'Arbeitsblatt', folder: 'bauteile' },
      { id: 'p3', title: 'Der Arbeitsspeicher', subtitle: 'Arbeitsblatt', folder: 'bauteile' },
      { id: 'p4', title: 'Der Bildschirm', subtitle: 'Arbeitsblatt', folder: 'bauteile' },
      { id: 'p5', title: 'Das EVA-Prinzip', subtitle: 'Arbeitsblatt', folder: 'eva' },
      { id: 'p6', title: 'EVA beim Smartphone', subtitle: 'Arbeitsblatt', folder: 'eva' },
      { id: 'p7', title: 'EVA am Computer', subtitle: 'Arbeitsblatt', folder: 'eva' },
      { id: 'p8', title: 'EVA bei der Konsole', subtitle: 'Arbeitsblatt', folder: 'eva' }
    ];

    let items = [];
    let dragId = null;

    const tray = document.getElementById('tray');
    const dropAreas = {
      bauteile: document.getElementById('bauteile-area'),
      eva: document.getElementById('eva-area')
    };
    const leftCount = document.getElementById('leftCount');
    const statusText = document.getElementById('statusText');
    const progressFill = document.getElementById('progressFill');
    const doneBadge = document.getElementById('doneBadge');

    function shuffled(array) {
      const a = [...array];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startState(doShuffle = true) {
      const base = originalItems.map(item => ({ ...item, location: 'tray' }));
      items = doShuffle ? shuffled(base) : base;
      render();
    }

    function createCard(item) {
      const card = document.createElement('div');
      card.className = 'sheet-card';
      card.draggable = true;
      card.dataset.id = item.id;
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', item.title);
      if (item.location === item.folder) card.classList.add('correct');

      card.innerHTML = `
        <div class="sheet-icon" aria-hidden="true"></div>
        <div class="sheet-text">
          <div class="sheet-name">${item.title}</div>
          <div class="sheet-sub">${item.subtitle}</div>
        </div>
        ${item.location === item.folder ? '<div class="check" aria-hidden="true">✓</div>' : ''}
      `;

      card.addEventListener('dragstart', () => {
        dragId = item.id;
        card.classList.add('dragging');
      });

      card.addEventListener('dragend', () => {
        dragId = null;
        card.classList.remove('dragging');
      });

      card.addEventListener('keydown', (e) => {
        const order = ['tray', 'bauteile', 'eva'];
        const current = item.location;
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          const next = current === 'tray' ? item.folder : 'tray';
          moveItem(item.id, next);
        }
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          const next = current === 'tray' ? item.folder : 'tray';
          moveItem(item.id, next);
        }
      });

      return card;
    }

    function renderSection(container, filter) {
      container.innerHTML = '';
      const sectionItems = items.filter(filter);
      if (sectionItems.length === 0 && container !== tray) {
        const hint = document.createElement('div');
        hint.className = 'drop-hint';
        hint.textContent = 'Blätter hier ablegen';
        container.appendChild(hint);
      }
      sectionItems.forEach(item => container.appendChild(createCard(item)));
    }

    function updateProgress() {
      const sorted = items.filter(item => item.location === item.folder).length;
      const left = items.filter(item => item.location === 'tray').length;
      leftCount.textContent = left;
      statusText.textContent = `${sorted} von ${items.length} sortiert`;
      progressFill.style.width = `${(sorted / items.length) * 100}%`;
      doneBadge.classList.toggle('show', sorted === items.length);

      document.querySelectorAll('.dropzone').forEach(zone => {
        const key = zone.dataset.folder;
        const zoneItems = items.filter(item => item.location === key);
        const allCorrect = zoneItems.length > 0 && zoneItems.every(item => item.folder === key);
        zone.classList.toggle('correct-glow', allCorrect);
      });
    }

    function render() {
      renderSection(tray, item => item.location === 'tray');
      renderSection(dropAreas.bauteile, item => item.location === 'bauteile');
      renderSection(dropAreas.eva, item => item.location === 'eva');
      updateProgress();
    }

    function moveItem(id, location) {
      items = items.map(item => item.id === id ? { ...item, location } : item);
      render();
    }

    document.querySelectorAll('.dropzone').forEach(zone => {
      zone.addEventListener('dragover', e => {
        e.preventDefault();
        zone.classList.add('over');
      });
      zone.addEventListener('dragleave', () => zone.classList.remove('over'));
      zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('over');
        if (dragId) moveItem(dragId, zone.dataset.folder);
      });
    });

    tray.addEventListener('dragover', e => e.preventDefault());
    tray.addEventListener('drop', e => {
      e.preventDefault();
      if (dragId) moveItem(dragId, 'tray');
    });

    document.getElementById('resetBtn').addEventListener('click', () => startState(false));
    document.getElementById('shuffleBtn').addEventListener('click', () => startState(true));

    startState(true);
  </script>
</body>
</html>
